[package]
name = "graphloom-studio"
description = "Host-side Studio services for GraphLoom"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[features]
default = []
sqlite-store = ["graphloom/sqlite-store"]
server = ["sqlite-store", "dep:clap", "dep:tower-http"]

[dependencies]
async-trait.workspace = true
axum.workspace = true
chrono.workspace = true
clap = { workspace = true, optional = true }
dashmap.workspace = true
futures-util.workspace = true
graphloom.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }
tower-http = { workspace = true, optional = true }
tracing.workspace = true

[[bin]]
name = "graphloom-studio"
path = "src/main.rs"
required-features = ["server"]

[dev-dependencies]
polars-core.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }
